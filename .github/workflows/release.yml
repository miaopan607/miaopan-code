name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - name: Validate version
        run: |
          version=$(node -p "require('./packages/miaopan-code/package.json').version")
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Set release version
        run: echo "MIAOPAN_CODE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build SDK
        run: bun ./packages/sdk/js/script/build.ts
        env:
          MIAOPAN_CODE_CHANNEL: latest
      - name: Publish SDK
        run: bun ./packages/sdk/js/script/publish.ts
        env:
          MIAOPAN_CODE_CHANNEL: latest
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish plugin
        run: bun ./packages/plugin/script/publish.ts
        env:
          MIAOPAN_CODE_CHANNEL: latest
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Build CLI
        run: bun run --cwd packages/miaopan-code build
        env:
          MIAOPAN_CODE_CHANNEL: latest
          MIAOPAN_CODE_RELEASE: "1"
      - name: Publish npm packages
        run: bun run --cwd packages/miaopan-code ./script/publish.ts
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Package licenses and checksums
        run: |
          cp LICENSE NOTICE packages/miaopan-code/dist/
          sha256sum packages/miaopan-code/dist/*.{zip,tar.gz} schemas/config.json schemas/tui.json > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes packages/miaopan-code/dist/*.zip packages/miaopan-code/dist/*.tar.gz packages/miaopan-code/dist/LICENSE packages/miaopan-code/dist/NOTICE schemas/config.json schemas/tui.json SHA256SUMS
