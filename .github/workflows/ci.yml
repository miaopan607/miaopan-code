name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - run: bun --cwd packages/miaopan-code typecheck
      - run: bun --cwd packages/core typecheck
      - run: bun --cwd packages/tui typecheck
      - run: bun --cwd packages/llm typecheck
      - run: bun --cwd packages/plugin typecheck
      - run: bun --cwd packages/protocol typecheck
      - run: bun --cwd packages/schema typecheck
      - run: bun --cwd packages/server typecheck
      - run: bun --cwd packages/sdk/js typecheck
